<body style="font-family:sans-serif; text-align:center; background:#f4f7f6; padding-top:25px; margin:0; padding-bottom: 50px;">

        <button onclick="kataBerikutnya()" style="background:#28a745; color:white; border:none; padding:12px 24px; font-size:16px; font-weight:bold; border-radius:8px; cursor:pointer;">LANJUT ➔</button>

    <script>
        // DATA UTUH: 15 MASTER IRREGULAR VERBS DARI MODUL HALAMAN 10 (4TH DAY)
        let kumpulanKata = [
            { v1: "Become", v2: "Became", v3: "Become", baca: "bikam - bikeim - bikam", indonesia: "Menjadi", grammar: "<b>V1 (Simple Present):</b> I want to <u>become</u> a doctor.<br><b>V2 (Simple Past):</b> He <u>became</u> a leader yesterday.<br><b>V3 (Present Perfect):</b> She has <u>become</u> successful." },
            { v1: "Begin", v2: "Began", v3: "Begun", baca: "bigin - bigen - bigan", indonesia: "Memulai", grammar: "<b>V1 (Simple Present):</b> Let's <u>begin</u> the class.<br><b>V2 (Simple Past):</b> The rain <u>began</u> an hour ago.<br><b>V3 (Present Perfect):</b> The concert has <u>begun</u>." },
            { v1: "Break", v2: "Broke", v3: "Broken", baca: "breik - brouk - brouken", indonesia: "Mematahkan / Merusak", grammar: "<b>V1 (Simple Present):</b> Don't <u>break</u> the rules.<br><b>V2 (Simple Past):</b> He <u>broke</u> his phone last night.<br><b>V3 (Present Perfect):</b> The window is <u>broken</u>." },
            { v1: "Bring", v2: "Brought", v3: "Brought", baca: "brin - brot - brot", indonesia: "Membawa", grammar: "<b>V1 (Simple Present):</b> Always <u>bring</u> your book.<br><b>V2 (Simple Past):</b> She <u>brought</u> some cakes yesterday.<br><b>V3 (Present Perfect):</b> I have <u>brought</u> the camera." },
            { v1: "Build", v2: "Built", v3: "Built", baca: "bild - bilt - bilt", indonesia: "Membangun", grammar: "<b>V1 (Simple Present):</b> They <u>build</u> a house.<br><b>V2 (Simple Past):</b> Company <u>built</u> this office in 2020.<br><b>V3 (Present Perfect):</b> The library has been <u>built</u>." },
            { v1: "Buy", v2: "Bought", v3: "Bought", baca: "bai - bot - bot", indonesia: "Membeli", grammar: "<b>V1 (Simple Present):</b> I <u>buy</u> coffee every morning.<br><b>V2 (Simple Past):</b> Father <u>bought</u> a new car last week.<br><b>V3 (Present Perfect):</b> We have <u>bought</u> the tickets." },
            { v1: "Choose", v2: "Chose", v3: "Chosen", baca: "cuuz - couz - couzen", indonesia: "Memilih", grammar: "<b>V1 (Simple Present):</b> Please <u>choose</u> one option.<br><b>V2 (Simple Past):</b> She <u>chose</u> the red dress last night.<br><b>V3 (Present Perfect):</b> You have <u>chosen</u> the right way." },
            { v1: "Come", v2: "Came", v3: "Come", baca: "kam - keim - kam", indonesia: "Datang", grammar: "<b>V1 (Simple Present):</b> They <u>come</u> here every Sunday.<br><b>V2 (Simple Past):</b> My friend <u>came</u> to my house yesterday.<br><b>V3 (Present Perfect):</b> Guests have <u>come</u>." },
            { v1: "Cut", v2: "Cut", v3: "Cut", baca: "kat - kat - kat", indonesia: "Memotong", grammar: "<b>Bentuk Tetap (V1 = V2 = V3)</b><br>Contoh Past Tense: She <u>cut</u> the paper yesterday.<br><i>(Kata 'cut' tidak berubah bentuk meskipun kejadian lampau).</i>" },
            { v1: "Do", v2: "Did", v3: "Done", baca: "du - did - dan", indonesia: "Melakukan", grammar: "<b>V1 (Simple Present):</b> I <u>do</u> my homework.<br><b>V2 (Simple Past):</b> She <u>did</u> a great job yesterday.<br><b>V3 (Present Perfect):</b> Project is finally <u>done</u>!" },
            { v1: "Draw", v2: "Drew", v3: "Drawn", baca: "dro - dru - dron", indonesia: "Menggambar", grammar: "<b>V1 (Simple Present):</b> Children <u>draw</u> a mountain.<br><b>V2 (Simple Past):</b> Ari <u>drew</u> a beautiful logo last week.<br><b>V3 (Present Perfect):</b> The picture is <u>drawn</u> well." },
            { v1: "Drive", v2: "Drove", v3: "Driven", baca: "draiv - drouv - driven", indonesia: "Mengemudi", grammar: "<b>V1 (Simple Present):</b> Drive carefully on highway.<br><b>V2 (Simple Past):</b> He <u>drove</u> to Jakarta last month.<br><b>V3 (Present Perfect):</b> She has <u>driven</u> for 5 hours." },
            { v1: "Fall", v2: "Fell", v3: "Fallen", baca: "fol - fel - follen", indonesia: "Terjatuh", grammar: "<b>V1 (Simple Present):</b> Leaves <u>fall</u> in autumn.<br><b>V2 (Simple Past):</b> The glass <u>fell</u> from table just now.<br><b>V3 (Present Perfect):</b> Rain has <u>fallen</u>." },
            { v1: "Feel", v2: "Felt", v3: "Felt", baca: "fiil - felt - felt", indonesia: "Merasakan", grammar: "<b>V1 (Simple Present):</b> I <u>feel</u> happy today.<br><b>V2 (Simple Past):</b> He <u>felt</u> sick last night.<br><b>V3 (Present Perfect):</b> We have always <u>felt</u> comfortable here." },
            { v1: "Find", v2: "Found", v3: "Found", baca: "faind - faund - faund", indonesia: "Menemukan", grammar: "<b>V1 (Simple Present):</b> Help me <u>find</u> my key.<br><b>V2 (Simple Past):</b> I <u>found</u> a wallet on the street yesterday.<br><b>V3 (Present Perfect):</b> Lost dog is finally <u>found</u>." }
        ];

        let urutan = 0; 
        let tampilInggris = true;

        const kata = document.getElementById("tulisanKata"); 
        const caraBaca = document.getElementById("caraBaca"); 
        const petunjuk = document.getElementById("petunjuk"); 
        const counter = document.getElementById("counter");
        const teksGrammar = document.getElementById("teksGrammar");
        const kolomKetik = document.getElementById("kolomKetik");
        const hasilPeriksa = document.getElementById("hasilPeriksa");

        function segar() {
            if (!kumpulanKata[urutan]) return;
            let item = kumpulanKata[urutan];
            
            if (tampilInggris) {
                kata.innerText = `${item.v1} - ${item.v2} - ${item.v3}`;
                caraBaca.innerText = "Pelafalan: " + item.baca;
                petunjuk.innerText = "(Ketuk kotak untuk melihat arti)";
            } else {
                kata.innerText = item.indonesia;
                caraBaca.innerText = "Arti Kata Kerja";
                petunjuk.innerText = "(Ketuk kotak untuk melihat kata Inggris)";
            }
