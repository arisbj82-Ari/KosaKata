<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Hafalan Vocab A-Z - Ari Studio</title>
    <style>
        .flip-container { perspective: 1000px; margin: 20px auto; width: 85%; max-width: 300px; cursor: pointer; }
        .flipper { transition: 0.6s; transform-style: preserve-3d; position: relative; height: 160px; }
        .flipper.flipped { transform: rotateY(180deg); }
        .front, .back { backface-visibility: hidden; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 2px solid #007bff; border-radius: 15px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .front { background: #ffffff; color: #333333; transform: rotateY(0deg); font-size: 30px; font-weight: bold; }
        .back { background: #e6f2ff; color: #007bff; transform: rotateY(180deg); font-size: 26px; font-weight: bold; }
    </style>
</head>
<body style="font-family:sans-serif; text-align:center; background:#f4f7f6; margin:0; padding-bottom: 50px;">
    
    <div style="background: #007bff; padding: 25px 10px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">

    </div>

    <div style="margin: 20px auto; width: 90%; max-width: 400px; text-align: left;">
        <label style="font-weight: bold; color: #555; display: block; margin-bottom: 5px;">Pilih Awalan Huruf:</label>
        <select id="alphabetSelect" onchange="changeLetter()" style="width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #007bff; background: white; font-weight: bold; color: #333;">
            <option value="A">Huruf A</option><option value="B">Huruf B</option><option value="C">Huruf C</option><option value="D">Huruf D</option><option value="E">Huruf E</option><option value="F">Huruf F</option><option value="G">Huruf G</option><option value="H">Huruf H</option><option value="I">Huruf I</option><option value="J">Huruf J</option><option value="K">Huruf K</option><option value="L">Huruf L</option><option value="M">Huruf M</option><option value="O">Huruf O</option><option value="P">Huruf P</option><option value="Q">Huruf Q</option><option value="R">Huruf R</option><option value="S">Huruf S</option><option value="T">Huruf T</option><option value="U">Huruf U</option><option value="V">Huruf V</option><option value="W">Huruf W</option><option value="X">Huruf X</option><option value="Y">Huruf Y</option><option value="Z">Huruf Z</option>
        </select>
    </div>
    
    <div id="counter" style="font-size: 16px; color: #666; margin: 15px 0 5px 0; font-weight: bold;">Loading...</div>

    <div class="flip-container" onclick="flipCard()">
        <div id="flipper" class="flipper">
            <div class="front">
                <div id="wordText">Loading...</div>
                <div id="phonemicText" style="font-size: 15px; color: #666; font-weight: normal; margin-top: 10px; font-style: italic;"></div>
            </div>
            <div class="back">
                <div id="backText">Loading...</div>
                <div style="font-size: 14px; color: #007bff; font-weight: normal; margin-top: 10px;">Arti Kata</div>
            </div>
        </div>
    </div>
    
    <p style="color:#888; font-size: 14px; margin-bottom: 20px;">💡 Ketuk kartu untuk melihat efek putar visual arti bahasa Indonesia</p>

    <div>
        <button onclick="prevWord()" style="background:#6c757d; color:white; border:none; padding:12px 20px; font-size:16px; font-weight:bold; border-radius:8px; cursor:pointer; margin-right:10px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">🡨 KEMBALI</button>
        <button onclick="nextWord()" style="background:#28a745; color:white; border:none; padding:12px 24px; font-size:16px; font-weight:bold; border-radius:8px; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,0.1);">LANJUT ➔</button>
    </div>
    
    <div style="margin-top: 20px;">

    </div>
