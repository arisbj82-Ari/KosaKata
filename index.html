    <div onclick="tukarTampilan()" style="border: 3px solid #28a745; border-radius: 12px; padding: 35px 10px; width: 270px; margin: 15px auto; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer;">

        <div id="caraBaca" style="font-size: 16px; color: #6c757d; font-style: italic; margin-top: 5px;">Loading...</div>

    <!-- Tombol Putar Suara Audio -->
